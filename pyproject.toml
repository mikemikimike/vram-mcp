[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vram-mcp"
version = "0.1.0"
description = "MCP server to inspect and free NVIDIA GPU VRAM via Ollama + nvidia-smi."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "kfaim" }]
keywords = ["mcp", "ollama", "nvidia", "vram", "gpu", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "requests>=2.31",
    "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vram-mcp = "vram_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kfaim/vram-mcp"
Repository = "https://github.com/kfaim/vram-mcp"

[tool.hatch.build.targets.wheel]
packages = ["vram_mcp"]
